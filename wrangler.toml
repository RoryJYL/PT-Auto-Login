#:schema node_modules/wrangler/config-schema.json
name = "pt-auto-login"
main = "src/index.ts"
compatibility_date = "2024-10-11"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# 配了 assets 之后，默认先匹配静态文件，匹配不到才进 Worker 的 fetch
[assets]
directory = "./public"

[[kv_namespaces]]
binding = "PAL"
id = "dc2d2a2880fe409183508e2cda96282e"

[triggers]
crons = ["0 16 * * *"]
